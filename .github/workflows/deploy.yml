name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 🔹 Checkout the latest version of the repo
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      # 🔹 Rebuild and redeploy containers
      - name: Rebuild and restart Docker containers
        run: |
          cd ~/Swift-Dashboard-v2
          echo "Stopping old containers..."
          docker compose down --remove-orphans
          echo "Rebuilding and starting fresh containers..."
          docker compose build --no-cache
          docker compose up -d
