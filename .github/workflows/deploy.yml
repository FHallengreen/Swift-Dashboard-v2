name: Deploy to Raspberry Pi

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # 🔹 Clean repo fully (no need to preserve .env anymore)
      - name: Clean old workspace
        run: |
          cd ~/Swift-Dashboard-v2 || exit 0
          echo "Cleaning old workspace..."
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true

      # 🔹 Checkout latest repo state
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      # 🔹 Rebuild backend & frontend only
      - name: Rebuild backend and frontend only
        run: |
          echo "Rebuilding backend and frontend containers..."
          cd ${{ github.workspace }}
          docker compose -f docker-compose.yml build --no-cache backend frontend
          docker compose -f docker-compose.yml up -d backend frontend

