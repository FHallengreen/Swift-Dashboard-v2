name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 🔹 Clean repo fully (no need to preserve .env anymore)
      - name: Clean old workspace
        run: |
          cd ~/Swift-Dashboard-v2 || exit 0
          echo "Cleaning old workspace..."
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true

      # 🔹 Checkout latest repo state
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      # 🔹 Rebuild backend & frontend only
      - name: Rebuild backend and frontend only
        run: |
          cd ~/Swift-Dashboard-v2
          echo "Rebuilding backend and frontend containers..."
          docker compose build --no-cache backend frontend
          docker compose up -d backend frontend
