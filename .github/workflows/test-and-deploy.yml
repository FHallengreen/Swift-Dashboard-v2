name: Test and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testDB!
          MYSQL_DATABASE: swift_dashboard_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore & Build
        run: |
          cd backend && dotnet restore && dotnet build
          cd Tests && dotnet restore && dotnet build

      - name: Run Tests
        run: cd backend/Tests && dotnet test --no-build
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3307;Database=swift_dashboard_test;User=root;Password=testDB!"

  deploy:
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # 🔹 Clean repo fully (no need to preserve .env anymore)
      - name: Clean old workspace
        run: |
          cd ~/Swift-Dashboard-v2 || exit 0
          echo "Cleaning old workspace..."
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true

      # 🔹 Checkout latest repo state
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      # 🔹 Rebuild and restart all services
      - name: Rebuild and restart services
        run: |
          echo "Rebuilding backend and frontend containers..."
          cd ${{ github.workspace }}
          docker compose -f docker-compose.yml build --no-cache backend frontend
          echo "Restarting all services including cloudflared..."
          docker compose -f docker-compose.yml up -d --force-recreate nginx backend frontend
