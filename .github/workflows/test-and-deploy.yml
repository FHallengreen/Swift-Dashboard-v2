name: Test and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run stack + tests
        run: |
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from tests

      - name: Tear down test environment
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

  deploy:
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Free disk space
        run: |
          echo "=== Disk before ==="
          df -h /
          # Runner diagnostic logs grow unbounded - keep last 10
          find ~/github-runner/_diag -type f -name '*.log' -printf '%T@ %p\n' 2>/dev/null \
            | sort -rn | tail -n +11 | cut -d' ' -f2- | xargs -r rm -f
          # Dangling images from previous builds, stopped containers, unused nets
          docker container prune -f
          docker image prune -f
          # Build cache older than 7 days, capped at 2GB
          docker builder prune -f --filter 'until=168h' --keep-storage 2GB
          # Only if still tight (<5GB free): drop unused base images too.
          # Costs a re-pull next step, so avoid unless needed.
          AVAIL_KB=$(df --output=avail / | tail -1)
          if [ "$AVAIL_KB" -lt 5242880 ]; then
            echo "Under 5GB free - pruning all unused images"
            docker image prune -af
            docker builder prune -af
          fi
          echo "=== Disk after ==="
          df -h /

      - name: Clean old workspace
        run: |
          cd ~/Swift-Dashboard-v2 || exit 0
          echo "Cleaning old workspace..."
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true

      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Pull base images (with retry)
        run: |
          for img in mcr.microsoft.com/dotnet/sdk:10.0 \
                     mcr.microsoft.com/dotnet/aspnet:10.0 \
                     node:24-alpine \
                     nginx:1.28-alpine \
                     nginx:alpine; do
            for attempt in 1 2 3; do
              docker pull "$img" && break
              if [ "$attempt" = "3" ]; then
                echo "::error::Failed to pull $img after 3 attempts"
                exit 1
              fi
              echo "Pull of $img failed (attempt $attempt), retrying in 15s..."
              sleep 15
            done
          done

      - name: Rebuild and restart services
        run: |
          echo "Rebuilding backend and frontend containers..."
          cd ${{ github.workspace }}
          docker compose -f docker-compose.yml build backend frontend
          echo "Restarting all services including cloudflared..."
          docker compose -f docker-compose.yml up -d --force-recreate nginx backend frontend
          echo "Pruning images orphaned by this build..."
          docker image prune -f
          df -h /
