name: Test and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run stack + tests
        run: |
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from tests

      - name: Tear down test environment
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

  deploy:
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Clean old workspace
        run: |
          cd ~/Swift-Dashboard-v2 || exit 0
          echo "Cleaning old workspace..."
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true

      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Rebuild and restart services
        run: |
          echo "Rebuilding backend and frontend containers..."
          cd ${{ github.workspace }}
          docker compose -f docker-compose.yml build --no-cache backend frontend
          echo "Restarting all services including cloudflared..."
          docker compose -f docker-compose.yml up -d --force-recreate nginx backend frontend
