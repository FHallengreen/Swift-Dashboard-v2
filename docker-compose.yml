services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swift_display_backend
    env_file:
      - /home/frede/swift-secrets/dashboard.env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    privileged: true
    volumes:
      - /usr/bin/sudo:/usr/bin/sudo:ro
      - /sbin/shutdown:/sbin/shutdown:ro
      - /tmp/swift-triggers:/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - swift_network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swift_display_frontend
    env_file:
      - /home/frede/swift-secrets/dashboard.env
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - swift_network
  nginx:
    image: nginx:alpine
    container_name: swift_display_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - swift_network
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - /home/frede/swift-secrets/cloudflared:/etc/cloudflared
    networks:
      - swift_network
  db:
    image: mysql:8.0
    container_name: swift_display_db
    env_file:
      - /home/frede/swift-secrets/dashboard.env
    volumes:
      - db-data:/var/lib/mysql
      - ./Database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./Database/02-insert_data.sql:/docker-entrypoint-initdb.d/02-insert_data.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - swift_network
volumes:
  db-data:
networks:
  swift_network:
    driver: bridge
