services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swift_display_backend
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=${DB_HOST};Database=${MYSQL_DATABASE};User=${DB_USER};Password=${MYSQL_ROOT_PASSWORD};Connection Timeout=30;Command Timeout=60;
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - swift_network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: swift_display_frontend
    expose:
      - "5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/eslint.config.js:/app/eslint.config.js
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - swift_network
  nginx:
    image: nginx:alpine
    container_name: swift_display_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - swift_network
  db:
    image: mysql:8.0
    container_name: swift_display_db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - db-data:/var/lib/mysql
      - ./Database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./Database/02-insert_data.sql:/docker-entrypoint-initdb.d/02-insert_data.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - swift_network
volumes:
  db-data:
networks:
  swift_network:
    driver: bridge
