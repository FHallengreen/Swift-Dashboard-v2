services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test123
      MYSQL_DATABASE: swift_dashboard
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -ptest123 -e 'USE swift_dashboard'"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - test-db:/var/lib/mysql
      - ./Database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
    - "3307:3306"

  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=db;Database=swift_dashboard;User=root;Password=test123;
    depends_on:
      db:
        condition: service_healthy
  
    expose:
      - "8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/e2e.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    depends_on:
      db:
        condition: service_healthy
      nginx:
        condition: service_started
    environment:
      E2E_BASE_URL: http://nginx
      ConnectionStrings__DefaultConnection: Server=db;Database=swift_dashboard;User=root;Password=test123;

volumes:
  test-db:
